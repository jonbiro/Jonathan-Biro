<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,follow" />
    <meta name="theme-color" content="#131619" />
    <title>Page Not Found — Jonathan Biro</title>
    <meta name="description" content="This page could not be found. Return to Jonathan Biro's software engineering and test automation portfolio." />
    <style>
        :root {
            color-scheme: dark;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #131619;
            color: #e7eaee;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(ellipse 700px 600px at 90% 20%, #1b2b29 0%, transparent 75%), #131619;
        }

        a {
            color: #b4c8de;
            text-underline-offset: 5px;
        }

        a:hover {
            color: #fff;
        }

        a:focus-visible {
            outline: 2px solid #a7bbd1;
            outline-offset: 5px;
        }

        .page {
            width: min(1104px, calc(100% - 44px));
            min-height: 100vh;
            margin: 0 auto;
            display: grid;
            grid-template-rows: auto 1fr auto;
        }

        .header,
        .footer {
            padding: 25px 0;
            border-bottom: 1px solid #30353c;
        }

        .footer {
            border-top: 1px solid #30353c;
            border-bottom: 0;
            color: #929da9;
            font-size: .8125rem;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            color: #e7eaee;
            font-weight: 600;
            text-decoration: none;
        }

        .brand-mark {
            font-family: Georgia, "Times New Roman", serif;
            font-size: 2rem;
            line-height: 1;
            letter-spacing: -.08em;
            color: #a6c6bd;
        }

        main {
            display: grid;
            place-items: center;
            padding: 72px 0;
        }

        .not-found {
            width: min(760px, 100%);
            padding: clamp(30px, 6vw, 64px);
            border: 1px solid #465b56;
            border-radius: 16px;
            background: linear-gradient(125deg, #1e2a28, #171e24 60%);
            box-shadow: 0 20px 60px #05090b40, inset 0 1px 0 #afcfc016;
        }

        .eyebrow {
            margin: 0 0 18px;
            color: #a6bdb7;
            font-size: .8125rem;
            font-weight: 600;
            letter-spacing: .075em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(3rem, 9vw, 5.8rem);
            font-weight: 400;
            line-height: 1.05;
            letter-spacing: -.055em;
            color: #f0eeea;
        }

        h1 em {
            color: #b8d4c5;
            font-weight: 400;
        }

        .explanation {
            max-width: 560px;
            margin: 24px 0 0;
            color: #aab2bd;
            font-size: 1.0625rem;
            line-height: 1.75;
        }

        .actions {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 24px;
            margin-top: 30px;
            font-size: .875rem;
        }

        .primary-action {
            display: inline-flex;
            align-items: center;
            min-height: 46px;
            padding: 10px 20px;
            border: 1px solid #d0e1d7;
            border-radius: 6px;
            background: linear-gradient(135deg, #c3d8ce, #a9c5b9);
            box-shadow: 0 3px 0 #678679, 0 8px 24px #0003;
            color: #142320;
            font-weight: 700;
            text-decoration: none;
        }

        .primary-action:hover {
            color: #142320;
            background: #c4d8d1;
            text-decoration: none;
        }

        @media (max-width: 520px) {
            .page { width: min(100% - 36px, 1104px); }
            main { padding: 44px 0; }
            .not-found { padding: 28px 22px; }
            .actions { align-items: flex-start; flex-direction: column; gap: 20px; }
        }
    </style>
</head>

<body>
    <div class="page">
        <header class="header">
            <a class="brand" href="https://jonathanbiro.com/" aria-label="Jonathan Biro portfolio home">
                <span class="brand-mark" aria-hidden="true">jb.</span>
                Jonathan Biro
            </a>
        </header>
        <main>
            <section class="not-found" aria-labelledby="page-title">
                <p class="eyebrow">404 · Route check failed</p>
                <h1 id="page-title">This page<br><em>didn’t ship.</em></h1>
                <p class="explanation">The address may be outdated or mistyped. The portfolio and its public source are both still available.</p>
                <div class="actions">
                    <a id="home-link" class="primary-action" href="https://jonathanbiro.com/">Return to portfolio</a>
                    <a href="https://github.com/jonbiro/Jonathan-Biro">View the source on GitHub ↗</a>
                </div>
            </section>
        </main>
        <footer class="footer">Jonathan Biro · Software engineering &amp; quality automation</footer>
    </div>
</body>

</html>
